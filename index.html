<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDIO SOUTHWEST — Design-Atelier & Product Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-abyss: #081018;
      --text-foam: #F4F6F8;
      --text-muted: rgba(244, 246, 248, 0.45);
      --accent-buoy: #FF5A26;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-abyss);
      color: var(--text-foam);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* HERO BÜHNE */
    .hero-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.2rem 3.5rem;
      background-color: var(--bg-abyss);
    }

    /* HINTERGRUNDBILD (Küste & Leuchtturm) */
    .coast-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      filter: brightness(0.9) contrast(1.06);
      user-select: none;
      pointer-events: none;
    }

    /* Subtile Vignette für perfekte Lesbarkeit links & oben */
    .coast-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(90deg, rgba(8, 16, 24, 0.84) 0%, rgba(8, 16, 24, 0.36) 48%, rgba(8, 16, 24, 0.12) 100%),
        linear-gradient(180deg, rgba(8, 16, 24, 0.58) 0%, transparent 25%, rgba(8, 16, 24, 0.9) 100%);
      pointer-events: none;
    }

    /* ANIMIERTER LICHTSTRAHL (1:1 Pixel-Overlay über der Bühne) */
    .lighthouse-beam-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* HEADER – LINKS BÜNDIG, DAMIT DER LEUCHTTURM RECHTS KOMPLETT FREI BLEIBT */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .brand-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.75rem, 2.6vw, 2.5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text-foam);
      text-decoration: none;
    }

    .brand-coords {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .telemetry {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--accent-buoy);
      background: rgba(8, 16, 24, 0.62);
      backdrop-filter: blur(8px);
      padding: 0.45rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      margin-top: 0.15rem;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-buoy);
      box-shadow: 0 0 8px var(--accent-buoy);
      animation: pulse 2.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    /* ZENTRALES LEUCHTTURM-MENÜ */
    .beacon-nav {
      position: relative;
      z-index: 10;
      max-width: 580px;
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      padding-left: 0.5rem;
    }

    .nav-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(165, 243, 252, 0.75);
      margin-bottom: 0.1rem;
    }

    .beacon-item {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 1.1rem;
      text-decoration: none;
      padding: 0.35rem 0 0.35rem 1.4rem;
      border-left: 2px solid rgba(255, 255, 255, 0.14);
      transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .beacon-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      transition: color 0.65s ease;
    }

    .beacon-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .beacon-label {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2.1rem, 3.6vw, 3.3rem);
      line-height: 1.05;
      color: rgba(244, 246, 248, 0.34);
      letter-spacing: 0.01em;
      transition: color 0.65s ease, text-shadow 0.65s ease, transform 0.65s ease;
    }

    .beacon-sub {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.86rem;
      line-height: 1.35;
      color: rgba(244, 246, 248, 0);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ZUSTAND WENN DER LICHTSTRAHL DEN MENÜPUNKT TRIFFT */
    .beacon-item.illuminated {
      border-left-color: #A5F3FC;
      transform: translateX(8px);
    }

    .beacon-item.illuminated .beacon-index {
      color: var(--accent-buoy);
    }

    .beacon-item.illuminated .beacon-label {
      color: #FFFFFF;
      text-shadow:
        0 0 28px rgba(165, 243, 252, 0.65),
        0 0 60px rgba(165, 243, 252, 0.28);
    }

    .beacon-item.illuminated .beacon-sub {
      color: rgba(244, 246, 248, 0.82);
      max-height: 3.2rem;
      opacity: 1;
      margin-top: 0.25rem;
    }

    /* UNTERE STATUSLEISTE */
    .bottom-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .beam-control {
      background: rgba(8, 16, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-foam);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .beam-control:hover {
      border-color: var(--accent-buoy);
      background: rgba(255, 90, 38, 0.14);
    }

    /* PLATZHALTER-SEKTIONEN UNTERHALB */
    .content-sections {
      position: relative;
      z-index: 10;
      background: #081018;
      padding: 5rem 3.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section-card {
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
    }

    .section-card span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent-buoy);
    }

    .section-card h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      margin: 0.5rem 0 0.75rem;
    }

    .section-card p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: rgba(244, 246, 248, 0.7);
    }

    @media (max-width: 768px) {
      .hero-stage {
        padding: 1.5rem;
      }
      .beacon-nav {
        gap: 1.35rem;
      }
      .content-sections {
        padding: 3rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="hero-stage" id="heroStage">
    <!-- Hintergrundbild (Steilküste & Leuchtturm) -->
    <img src="coast.jpg" id="coastImg" alt="Alentejo Atlantikküste mit Leuchtturm" class="coast-bg" />
    <div class="coast-vignette"></div>

    <!-- Dynamischer Leuchtturm-Lichtstrahl (1:1 Pixel-Koordinaten) -->
    <svg class="lighthouse-beam-layer" id="beamSvg">
      <defs>
        <linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="1200" y1="130" x2="0" y2="350">
          <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.92" />
          <stop offset="12%" stop-color="#BAE6FD" stop-opacity="0.48" />
          <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
        </linearGradient>

        <filter id="beamBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="14" />
        </filter>
        <filter id="coreBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>

      <!-- Äußerer atmosphärischer Lichtkegel (läuft spitz in das Leuchtfeuer) -->
      <polygon id="beamOuter" points="0,0 0,0 0,0" fill="url(#beamGrad)" filter="url(#beamBlur)" />
      <!-- Heller innerer Lichtkern -->
      <polygon id="beamCore" points="0,0 0,0 0,0" fill="url(#beamGrad)" filter="url(#coreBlur)" opacity="0.7" />
      <!-- Kleiner Lichtpunkt direkt im oberen Leuchtfeuer -->
      <circle id="lanternGlow" cx="0" cy="0" r="4" fill="#FEF3C7" filter="url(#coreBlur)" opacity="0.85" />
    </svg>

    <!-- Kopfbereich komplett links ausgerichtet -->
    <header class="top-bar">
      <div class="brand">
        <a href="#" class="brand-title">STUDIO SOUTHWEST</a>
        <span class="brand-coords">37.6° N, 8.7° W • ALENTEJO COAST</span>
      </div>
      <div class="telemetry">
        <span class="pulse-dot"></span>
        <span>DESIGN-ATELIER & PRODUCT STUDIO

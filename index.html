  <title>STUDIO SOUTHWEST — Design-Atelier & Product Studio</title>

  <style>
    :root {
      --bg-abyss: #081018;
      --text-foam: #F4F6F8;
      --text-muted: rgba(244, 246, 248, 0.45);
      --accent-buoy: #FF5A26;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-abyss);
      color: var(--text-foam);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* HERO BÜHNE */
    .hero-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.2rem 3.5rem;
      background-color: var(--bg-abyss);
    }

    /* HINTERGRUNDBILD (Küste & Leuchtturm) */
    .coast-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      filter: brightness(0.9) contrast(1.06);
      user-select: none;
      pointer-events: none;
    }

    /* Subtile Vignette für perfekte Lesbarkeit links & oben */
    .coast-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(90deg, rgba(8, 16, 24, 0.84) 0%, rgba(8, 16, 24, 0.36) 48%, rgba(8, 16, 24, 0.12) 100%),
        linear-gradient(180deg, rgba(8, 16, 24, 0.58) 0%, transparent 25%, rgba(8, 16, 24, 0.9) 100%);
      pointer-events: none;
    }
